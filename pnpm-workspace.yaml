packages:
  - apps/**/*
  - packages/**/*
  - e2e

allowBuilds:
  "@apollo/rover": true
  "@parcel/watcher": true
  esbuild: true
  sharp: true
  unrs-resolver: true

ignoredBuiltDependencies:
  - "@apollo/rover"

minimumReleaseAgeExclude:
  - "@vitest/coverage-v8@5.1.1"
  - "@vitest/mocker@5.1.1"
  - "@vitest/spy@5.1.1"
  - vitest@5.1.1

onlyBuiltDependencies:
  - "@parcel/watcher"
  - esbuild
  - sharp
  - unrs-resolver

# GHSA-3g3m-2fjr-6pw4: no patched glob 13.x; 14 is API compatible for cpx2 and
# the Storybook docgen plugin. Remove once both depend on glob >= 14.0.2.
overrides:
  "glob@13": 14.0.6
