name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
    branches: [main]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      TURBO_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TURBO_TEAM: ${{ secrets.VERCEL_TEAM }}
      NEXT_PUBLIC_DATOCMS_READONLY_TOKEN: ${{ secrets.DATOCMS_ACCESS_TOKEN }}

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Browsers follow the @playwright/test version in the lockfile, so there
      # is no separate image tag to keep in sync.
      - name: Get Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @mono/e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm e2e:install

      # System libraries are not part of the cache.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @mono/e2e exec playwright install-deps chromium

      - name: Build application
        run: pnpm build

      - name: Run Playwright tests
        run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  mock-e2e:
    name: Mock e2e tests
    timeout-minutes: 30
    runs-on: ubuntu-latest

    # No DatoCMS token on purpose: every page is served from the local mock
    # backend in e2e/mock-server, so the tests never depend on outside content.
    env:
      TURBO_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TURBO_TEAM: ${{ secrets.VERCEL_TEAM }}

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Browsers follow the @playwright/test version in the lockfile, so there
      # is no separate image tag to keep in sync.
      - name: Get Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @mono/e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm e2e:install

      # System libraries are not part of the cache.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @mono/e2e exec playwright install-deps chromium

      - name: Build the packages used by the app
        run: pnpm --filter "@mono/lundi-bleu^..." build

      - name: Run mock e2e tests
        run: pnpm e2e:mock

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: mock-playwright-report
          path: e2e/playwright-report/
          retention-days: 30
